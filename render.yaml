# Render blueprint for the Comix fast constants JSON relay.
# This service only serves comix-relay/comix-fast-constants.json at runtime.
# To refresh that JSON from the live site, run `npm run refresh` inside
# comix-relay before deploying, or from a shell on the Render instance.

services:
    - type: web
      name: comix-fast-constants-relay
      runtime: node
      rootDir: comix-relay
      buildCommand: npm install
      startCommand: npm start
      plan: free
      autoDeploy: true
      healthCheckPath: /health
      envVars:
          - key: NODE_VERSION
            value: "20"
